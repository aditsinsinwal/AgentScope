name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy agentscope

      - name: Test
        run: pytest --cov=agentscope --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../agentscope/api/static

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope
          POSTGRES_DB: agentscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentscope -d agentscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTSCOPE_DATABASE_URL: postgresql+asyncpg://agentscope:agentscope@127.0.0.1:5432/agentscope
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Migrate up, down, and up again
        env:
          PGPASSWORD: agentscope
        run: |
          psql_q() { psql -h 127.0.0.1 -U agentscope -d agentscope -v ON_ERROR_STOP=1 -tA "$@"; }
          alembic upgrade head
          alembic downgrade base
          # Exercise the 0002 data path: a row written at 0001, NULL tokens at head, back to 0001.
          alembic upgrade 0001
          psql_q -c "INSERT INTO tasks (id, name, version, fingerprint, definition) VALUES ('mig', 'Migration', '1', '0', '{}')"
          psql_q -c "INSERT INTO runs (id, task_id, status, seed, agent_configuration, task_hash, environment_fingerprint, measurements, attempt, created_at, updated_at) VALUES ('run_mig', 'mig', 'created', 0, '{}', '', '', '{}', 0, now(), now())"
          psql_q -c "INSERT INTO trace_events (id, run_id, sequence, event_type, name, timestamp, status, input_tokens, output_tokens, event_metadata) VALUES (gen_random_uuid(), 'run_mig', 1, 'agent_step', 's', now(), 'ok', 5, 5, '{}')"
          alembic upgrade head
          psql_q -c "UPDATE trace_events SET input_tokens = NULL, output_tokens = NULL"
          alembic downgrade 0001
          test "$(psql_q -c 'SELECT input_tokens || output_tokens FROM trace_events')" = "00"
          alembic downgrade base
          test "$(psql_q -c "SELECT string_agg(table_name, ',') FROM information_schema.tables WHERE table_schema = 'public'")" = "alembic_version"
          alembic upgrade head

      - name: PostgreSQL integration tests
        env:
          AGENTSCOPE_TEST_POSTGRES: "1"
        run: pytest -m integration -v

  docker:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build sandbox image
        run: docker build -t agentscope-sandbox:py312 sandbox

      - name: Docker integration tests
        env:
          AGENTSCOPE_TEST_DOCKER: "1"
        run: pytest -m docker -v
