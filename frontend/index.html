<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1612" />
    <meta name="description" content="AgentScope autonomous-agent evaluation dashboard" />
    <title>AgentScope · Evaluation Dashboard</title>
    <style>
      .file-launcher {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #dbe7e1;
        background: radial-gradient(circle at 70% 0%, #173425, transparent 36rem), #07100d;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      .file-launcher__card {
        width: min(620px, 100%);
        padding: clamp(28px, 6vw, 52px);
        border: 1px solid #2b3d35;
        border-radius: 16px;
        background: #0d1915;
        box-shadow: 0 30px 100px #0006;
      }
      .file-launcher__mark { color: #b8f05a; font: 600 12px ui-monospace, monospace; }
      .file-launcher h1 { margin: 14px 0 12px; color: #eef7f2; font-size: clamp(30px, 7vw, 48px); line-height: 1.05; }
      .file-launcher p { margin: 0 0 22px; color: #91a49a; }
      .file-launcher code { display: block; overflow-x: auto; padding: 13px 15px; border-radius: 8px; color: #b8f05a; background: #060d0a; font: 12px ui-monospace, monospace; }
      .file-launcher a { display: inline-block; margin-top: 22px; padding: 11px 16px; border-radius: 8px; color: #07100d; background: #b8f05a; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (window.location.protocol === "file:") {
        document.getElementById("root").innerHTML = `
          <main class="file-launcher">
            <section class="file-launcher__card">
              <span class="file-launcher__mark">AGENTSCOPE / LOCAL DASHBOARD</span>
              <h1>Start the service first.</h1>
              <p>This is a Vite application backed by the AgentScope API, so it cannot run as a raw HTML file. Start the bundled dashboard from the project directory:</p>
              <code>./scripts/start-dashboard.sh</code>
              <a href="http://127.0.0.1:8000/">Open running dashboard</a>
            </section>
          </main>`;
      } else {
        await import("./src.tsx");
      }
    </script>
  </body>
</html>
